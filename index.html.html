<title>Louise Amorim | Cartomante</title>
<meta name="description" content="Louise Amorim, cartomante. Cartomante há 5 anos, guiada pela força cigana. Te ajudo a encontrar respostas, clareza e as melhores decisões através do oráculo.">
<meta name="theme-color" content="#420a15">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --wine-deep:#1d050b;
  --bg:#420a15;
  --wine:#4a0e1c;
  --gold:#e9b36b;
  --gold-soft:#f3d3a0;
  --cream:#fbeedd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--cream);
  background:var(--bg);
  display:flex;justify-content:center;
  padding:56px 36px 40px;
  -webkit-font-smoothing:antialiased;
}
main{
  position:relative;z-index:1;
  width:100%;max-width:440px;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
  min-height:calc(100vh - 96px);
}
.avatar{
  width:132px;height:132px;border-radius:50%;
  object-fit:cover;
  border:3px solid var(--gold);
  box-shadow:0 0 0 7px rgba(233,179,107,.14),0 12px 34px rgba(0,0,0,.55);
  animation:rise .8s cubic-bezier(.2,.8,.2,1) both;
}
h1{
  margin-top:22px;
  font-size:2rem;font-weight:800;letter-spacing:.01em;
  color:var(--gold-soft);
  text-shadow:0 2px 14px rgba(0,0,0,.5);
  animation:rise .8s .1s cubic-bezier(.2,.8,.2,1) both;
}
.role{
  margin-top:4px;font-weight:600;font-size:1.05rem;color:var(--gold);
  animation:rise .8s .18s cubic-bezier(.2,.8,.2,1) both;
}
.tagline{
  margin-top:10px;max-width:100%;line-height:1.38;text-wrap:balance;
  font-size:.84rem;color:var(--cream);opacity:.88;
  animation:rise .8s .26s cubic-bezier(.2,.8,.2,1) both;
}
.links{
  list-style:none;width:100%;margin-top:26px;
  display:flex;flex-direction:column;gap:14px;
}
.links li{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.links li:nth-child(1){animation-delay:.38s}
.links li:nth-child(2){animation-delay:.50s}
.links li:nth-child(3){animation-delay:.62s}
.links li:nth-child(4){animation-delay:.74s}
.btn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:17px 22px;
  border-radius:999px;
  border:1.5px solid var(--gold);
  background:rgba(40,5,15,.5);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  color:var(--gold-soft);
  font:800 1.05rem/1 'Nunito',sans-serif;
  text-decoration:none;
  box-shadow:0 8px 22px rgba(0,0,0,.4);
  transition:transform .25s ease,background .25s ease,color .25s ease,box-shadow .25s ease;
}
.btn svg{width:22px;height:22px;flex:none}
.btn:hover{
  transform:translateY(-3px);
  background:var(--gold);color:var(--wine-deep);
  box-shadow:0 14px 30px rgba(0,0,0,.5),0 0 22px rgba(233,179,107,.35);
}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
footer{
  margin-top:auto;padding-top:40px;
  font-size:.82rem;color:var(--cream);opacity:.6;
  animation:rise .8s .9s both;
}
button.btn{cursor:pointer}
.modal{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  padding:56px 16px 20px;
  background:rgba(15,2,6,.88);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  animation:fade .25s ease both;
}
.modal[hidden]{display:none}
.modal img{
  max-width:100%;max-height:100%;
  border-radius:18px;
  border:2px solid var(--gold);
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  animation:pop .3s cubic-bezier(.2,.8,.2,1) both;
}
.fechar{
  position:absolute;top:12px;right:14px;
  width:42px;height:42px;border-radius:50%;
  border:1.5px solid var(--gold);background:rgba(29,5,11,.8);
  color:var(--gold-soft);font:600 1.6rem/1 'Nunito',sans-serif;
  cursor:pointer;transition:background .2s,color .2s;
}
.fechar:hover{background:var(--gold);color:var(--wine-deep)}
.fechar:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
/* moldura estilo carta de tarot */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.frame{
  position:absolute;inset:14px;
  border:1px solid rgba(233,179,107,.55);
  border-radius:16px;
}
.frame::after{
  content:"";position:absolute;inset:6px;
  border:1px solid rgba(233,179,107,.22);
  border-radius:11px;
}
.sp{position:absolute;color:var(--gold);width:26px;height:26px;transform:translate(-50%,-50%)}
.sp.top{top:14px;left:50%;background:var(--bg);padding:0 10px;width:46px;box-sizing:border-box}
.sp.bottom{top:auto;bottom:14px;left:50%;transform:translate(-50%,50%);background:var(--bg);padding:0 10px;width:46px;box-sizing:border-box}
.sp.s{width:10px;height:10px}
.sp.m{width:15px;height:15px}
.sp.l{width:20px;height:20px}
.sp:not(.top):not(.bottom){animation:twinkle var(--t,3.6s) ease-in-out var(--d,0s) infinite}
@keyframes twinkle{0%,100%{scale:.45;opacity:.2}50%{scale:1.35;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (max-width:600px){
  h1{font-size:1.75rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
(function(){
  var modal=document.getElementById('modal-valores');
  var abrir=document.getElementById('abrir-valores');
  var fechar=document.getElementById('fechar-valores');
  function open(){modal.hidden=false;document.body.style.overflow='hidden';fechar.focus();}
  function close(){modal.hidden=true;document.body.style.overflow='';abrir.focus();}
